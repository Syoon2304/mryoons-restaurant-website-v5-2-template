<!-- Decorative short loop from R2 or another approved direct-file host. -->
<video autoplay muted loop playsinline preload="metadata" poster="/assets/images/approved-video-poster.webp">
  <source src="https://media.restaurant-domain.tld/approved-loop.mp4" type="video/mp4">
</video>

<!-- Cloudflare Stream iframe. Replace only the approved account/video identifier. -->
<iframe
  src="https://customer-account.cloudflarestream.com/video-id/iframe"
  title="Restaurant story video"
  loading="lazy"
  allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture"
  allowfullscreen>
</iframe>

<!-- Existing YouTube video. Use privacy-enhanced embed mode when appropriate. -->
<iframe
  src="https://www.youtube-nocookie.com/embed/video-id"
  title="Restaurant video"
  loading="lazy"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  allowfullscreen>
</iframe>
