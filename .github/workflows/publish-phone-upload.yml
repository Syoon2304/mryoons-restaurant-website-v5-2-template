name: Publish phone website upload

on:
  push:
    branches: [main]
    paths:
      - website.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phone-website-import-main
  cancel-in-progress: false

jobs:
  import-and-commit:
    name: Validate, extract, and commit real website files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run infrastructure unit tests
        run: python -m unittest discover -s tests -v

      - name: Test contact-function behavior
        run: node --test tests/contact-function.test.mjs

      - name: Safely import website.zip
        shell: bash
        run: |
          set +e
          python scripts/import_website_zip.py \
            --zip website.zip \
            --destination public \
            --policy infrastructure/importer-policy.json \
            --report-json .website-import-report.json \
            --report-md .website-import-report.md
          status=$?
          if [ -f .website-import-report.md ]; then
            cat .website-import-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Commit the validated website files
        shell: bash
        run: |
          if git diff --quiet -- public; then
            echo "No public website file changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version="$(python -c "import json; print(json.load(open('public/site-manifest.json'))['package_version'])")"
          git config user.name "Website Importer Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          git commit -m "Publish website package ${version}"
          git pull --rebase origin main
          git push origin HEAD:main
